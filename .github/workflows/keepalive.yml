# O plano grátis do Supabase pausa o projeto depois de 7 dias sem uso.
# Este robô faz uma consulta a cada 3 dias para o Supabase do FargusThreads
# continuar acordado. (O do FargusGram tem o robô dele, no repositório de lá.)
name: Manter o Supabase acordado

on:
  schedule:
    - cron: '41 10 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/keepalive.mjs
